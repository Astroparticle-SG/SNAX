[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snudd"
version = "1.0.0"
authors = [
    {name = "Dorian Amaral"},
    {name = "David Cerdeno"},
    {name = "Andrew Cheek"},
    {name = "Valeria Costa"},
    {name = "Patrick Foldenauer"},
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "pandas>=1.3",
    "packaging",
]

[project.optional-dependencies]
numba = [
    "numba>=0.57"
]
test = [
    "pytest>=7",
    "pytest-cov>=4",
]

[tool.setuptools.packages.find]
include = ["snudd*"]

[tool.setuptools.package-data]
snudd = ["data/*", "data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["snudd"]
